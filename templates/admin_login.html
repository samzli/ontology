<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin console sign in · {{ system_name }}</title>
    <link rel="stylesheet" href="/static/css/app.css?v=18">
    <link rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230E2A47'/><text x='16' y='22' font-size='17' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'>O</text></svg>">
    <style>
    .admin-auth {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(150deg, #0E2A47 0%, #12233d 55%, #0a1c33 100%);
      padding: 24px;
    }

    .admin-card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 30px 70px -20px rgba(0, 0, 0, .55);
      overflow: hidden;
    }

    .admin-head {
      background: linear-gradient(135deg, #0E2A47, #16395f);
      color: #fff;
      padding: 28px 30px 24px;
    }

    .admin-head .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 18px;
    }

    .admin-head .logo {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: #ED1B2E;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
    }

    .admin-head h1 {
      font-size: 20px;
      margin: 18px 0 4px;
    }

    .admin-head .sub {
      color: #aec4dd;
      font-size: 13px;
    }

    .admin-body {
      padding: 26px 30px 30px;
    }

    .admin-foot {
      text-align: center;
      padding: 0 30px 26px;
      font-size: 12.5px;
      color: #7a8496;
    }
  </style>
  </head>

  <body>
    <div class="admin-auth">
      <div class="admin-card">
        <div class="admin-head">
          <div class="brand"><span class="logo">O</span> {{ system_name }}</div>
          <h1>⚙️ Admin console</h1>
          <div class="sub">Restricted area — administrators only.</div>
        </div>
        <div class="admin-body">
          <div class="auth-error" id="errBox"></div>
          <form id="adminForm" autocomplete="off">
            <label class="fld">
              <span>Admin e-mail (or username)</span>
              <input type="text" id="fUser" required maxlength="254"
                placeholder="you@company.com" autofocus
                autocomplete="username">
            </label>
            <label class="fld">
              <span>Password</span>
              <input type="password" id="fPass" required maxlength="256"
                placeholder="Your password" autocomplete="current-password">
            </label>
            <button type="submit" class="btn btn-primary" style="width:100%"
              id="signBtn">Continue</button>
          </form>
          <form id="codeForm" autocomplete="off" style="display:none">
            <p class="small muted" style="margin:0 0 12px">
              A 6-digit code was sent to <b id="otpEmail">your inbox</b>.
            </p>
            <label class="fld">
              <span>Verification code</span>
              <input type="text" id="fCode" inputmode="numeric" required
                minlength="6" maxlength="6" pattern="[0-9]{6}"
                placeholder="123456" autocomplete="one-time-code">
            </label>
            <button type="submit" class="btn btn-primary" style="width:100%"
              id="codeBtn">Verify &amp; sign in</button>
            <div class="auth-switch" style="margin-top:10px">
              <button class="btn-link" id="resendBtn" type="button">Send a new
                code</button>
            </div>
          </form>
        </div>
        <div class="admin-foot">
          Looking for the user portal? <a href="/app"
            style="color:var(--navy);font-weight:600">Go to /app →</a>
        </div>
      </div>
    </div>
    <script src="/static/js/common.js?v=18"></script>
    <script>
    (function () {
      const { api } = Onti;
      const errBox = document.getElementById('errBox');
      const showErr = (m) => { errBox.textContent = m; errBox.classList.add('show'); };
      const state = { challenge: '' };
      const qs = new URLSearchParams(location.search);
      if (qs.get('expired')) showErr('Your session expired — please sign in again.');

      // If already signed in, route appropriately.
      api.get('/api/auth/me').then((d) => {
        if (d.user && d.user.role === 'admin') location.href = '/admin';
        else if (d.user) showErr('This account is not an administrator. Use the user portal instead.');
      }).catch(() => { });

      async function finish(role) {
        if (role !== 'admin') {
          showErr('This account is not an administrator. Use the user portal instead.');
          try { await api.post('/api/auth/logout', {}); } catch (_) { }
          document.getElementById('codeForm').style.display = 'none';
          document.getElementById('adminForm').style.display = 'block';
          return;
        }
        location.href = '/admin';
      }

      document.getElementById('adminForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        errBox.classList.remove('show');
        const btn = document.getElementById('signBtn');
        btn.disabled = true;
        try {
          const r = await api.post('/api/auth/signin/start', {
            identifier: document.getElementById('fUser').value.trim(),
            password: document.getElementById('fPass').value,
          });
          if (r.status === 'bind_required') {
            showErr('This account must first confirm an e-mail address in the '
              + 'user portal (/login).');
            btn.disabled = false;
            return;
          }
          state.challenge = r.challenge_id;
          document.getElementById('otpEmail').textContent = r.email_masked;
          document.getElementById('adminForm').style.display = 'none';
          document.getElementById('codeForm').style.display = 'block';
          document.getElementById('fCode').focus();
          startCooldown();
          if (r.debug_code) document.getElementById('fCode').value = r.debug_code;
        } catch (ex) {
          showErr(ex.status === 0
            ? 'Cannot reach the server. Check your connection and try again.'
            : ex.message);
        } finally {
          btn.disabled = false;
        }
      });

      document.getElementById('codeForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        errBox.classList.remove('show');
        const btn = document.getElementById('codeBtn');
        btn.disabled = true;
        try {
          const r = await api.post('/api/auth/signin/verify', {
            challenge_id: state.challenge,
            code: document.getElementById('fCode').value.trim(),
          });
          await finish(r.user ? r.user.role : '');
        } catch (ex) {
          showErr(ex.message);
        } finally {
          btn.disabled = false;
        }
      });

      let timer = null;
      function startCooldown() {
        const btn = document.getElementById('resendBtn');
        let left = 60;
        btn.disabled = true;
        btn.textContent = 'Send a new code (60s)';
        clearInterval(timer);
        timer = setInterval(() => {
          left -= 1;
          if (left <= 0) {
            clearInterval(timer);
            btn.disabled = false;
            btn.textContent = 'Send a new code';
          } else {
            btn.textContent = 'Send a new code (' + left + 's)';
          }
        }, 1000);
      }

      document.getElementById('resendBtn').addEventListener('click', async () => {
        if (!state.challenge) return;
        errBox.classList.remove('show');
        try {
          const r = await api.post('/api/auth/otp/resend', {
            challenge_id: state.challenge,
          });
          if (r.challenge_id) state.challenge = r.challenge_id;
          document.getElementById('otpEmail').textContent = r.email_masked;
          startCooldown();
          if (r.debug_code) document.getElementById('fCode').value = r.debug_code;
        } catch (ex) {
          showErr(ex.message);
        }
      });
    })();
  </script>
  </body>

</html>
