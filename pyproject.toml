[tool.black]
line-length = 88
target-version = ["py310"]
extend-exclude = '''
/(
    data
  | .venv
  | __pycache__
)/
'''

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["data", ".venv", "__pycache__"]

[tool.ruff.lint]
# E4/E7/E9 + F are the pyflakes/pycodestyle essentials; W covers whitespace,
# I keeps imports sorted. Line length is delegated to black (E501 off).
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["common", "modules", "routes"]
