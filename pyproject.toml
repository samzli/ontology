[project]
name = "onti"
version = "2.1.0"
description = "Onti: insurance ontology workspace — rules + AI Q&A."
requires-python = ">=3.10"
# Vercel's Python runtime installs from pyproject.toml when it is present,
# so the runtime dependencies must be declared here as well as in
# requirements.txt (used by Docker and pip installs).
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.20",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.2",
    "matplotlib>=3.8.0",
    "reportlab>=4.0.0",
    "pillow>=10.0.0",
]

[tool.uv]
# The app is deployed as source, not built as a wheel.
package = false

[tool.black]
line-length = 88
target-version = ["py310"]
extend-exclude = '''
/(
    data
  | .venv
  | __pycache__
)/
'''

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["data", ".venv", "__pycache__"]

[tool.ruff.lint]
# E4/E7/E9 + F are the pyflakes/pycodestyle essentials; W covers whitespace,
# I keeps imports sorted. Line length is delegated to black (E501 off).
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["common", "modules", "routes"]
